<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--p:#4f46e5;--t:#14b8a6;--bg:#f5f6fb;--c:#fff;--tx:#1e1b4b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:80px}
header{background:linear-gradient(135deg,var(--p),var(--t));color:#fff;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 16px;font-weight:800;font-size:20px}
main{padding:14px;max-width:700px;margin:auto}
h2{margin:6px 0 12px}

.card small{display:block;color:#6b7280;margin-top:4px}
.warn{border:2px solid #f59e0b}
.c{text-align:center}.mt{color:#6b7280;text-align:center}
button{font-family:inherit;cursor:pointer}
.big{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--p),var(--t));text-align:center}
.up{margin:8px 0}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--p);color:#fff;font-weight:700;margin:8px 4px;font-size:15px}

.row{display:flex;justify-content:center;flex-wrap:wrap}

.read{background:#fff;border-radius:16px;padding:18px;margin:10px 0;font-family:Amiri,Tajawal,serif;font-size:20px;line-height:2.1}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.ic{border:0;background:#fff;border-radius:10px;width:40px;height:40px;font-size:18px;margin-inline-start:4px}
.seg{display:flex;gap:6px;overflow-x:auto;margin:10px 0}

input,select{width:100%;padding:12px;margin:5px 0;border:1px solid #d1d5db;border-radius:10px;font-family:inherit;font-size:15px}
details summary{font-weight:700;cursor:pointer}details p{color:#374151;line-height:1.8}

.opt.ok{background:#d1fae5;border-color:#10b981}.opt.no{background:#ffe4e6;border-color:#e11d48}
#nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #e5e7eb;padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1;border:0;background:none;padding:10px 4px;font-size:12px;color:#6b7280;font-weight:700}

#panes{display:flex;flex-direction:column;gap:8px;height:calc(100dvh - 215px);min-height:320px;margin-top:8px}

</style></head><body>
<header>📚 ملخصاتي</header><main id="m"></main>
<nav id="nav">
<button data-t="lec" onclick="go('lec')"><span>🎙️</span>محاضرات</button>
<button data-t="pdf" onclick="go('pdf')"><span>📄</span>PDF</button>
<button data-t="sch" onclick="go('sch')"><span>🗓️</span>الجدول</button>
<button data-t="set" onclick="go('set')"><span>⚙️</span>إعدادات</button></nav>
<div id="ld"></div>
<script>
window.onerror=(m)=>{const x=document.querySelector('#m');if(x)x.innerHTML='<div class="card">حصل خطأ: '+m+'</div>'};
const $=s=>document.querySelector(s);
const MODEL='gemini-3.8-flash';
const SEG=600; /* طول كل جزء بالثواني (10 دقايق) */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let db;try{db=JSON.parse(localStorage.ms||'null')}catch(e){}
db=db||{items:[],sched:[]};db.items=db.items||[];db.sched=db.sched||[];
const save=()=>{try{localStorage.ms=JSON.stringify(db)}catch(e){alert('المساحة مليانة')}};
/* ===== تخزين الصوت (IndexedDB) ===== */
const idb=new Promise((res,rej)=>{const r=indexedDB.open('ms',1);r.onupgradeneeded=()=>r.result.createObjectStore('a');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const aput=async(k,v)=>{const d=await idb;return new Promise((res,rej)=>{const t=d.transaction('a','readwrite');t.objectStore('a').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})};
const aget=async k=>{const d=await idb;return new Promise((res,rej)=>{const q=d.transaction('a').objectStore('a').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
const adel=async k=>{try{const d=await idb;return new Promise(res=>{const t=d.transaction('a','readwrite');t.objectStore('a').delete(k);t.oncomplete=res;t.onerror=res})}catch(e){}};
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const md=s=>esc(s).replace(/^#+\s*(.*)$/gm,'<h4>$1</h4>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^[\*\-]\s+(.*)$/gm,'• $1').replace(/\n/g,'<br>');
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(b)});
const u8b64=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const busy=m=>{const l=$('#ld');l.style.display=m?'flex':'none';l.textContent=m||''};
const safeJ=t=>{try{return JSON.parse(t)}catch(e){return{title:'',summary:t}}};
const D=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
let tab='lec',cur=null,sub='a',zs={},op=null,stream,secs=0,ti,paused=false,wl=null,curSeg=null,curIt=null,rotating=false;
const pumping={},again={};
const P_T='اكتب النص الكامل للكلام في التسجيل ده (transcript) كلمة بكلمة من غير أي مقدمة أو تعليق.';
const P_S2='ده نص محاضرة كاملة. لخصه تلخيص منظم ومفصل بعناوين ونقاط واضحة. رجّع JSON فقط بالشكل: {"title":"عنوان قصير","summary":"..."}';
const P_PDF='لخّص ملف الـ PDF ده تلخيص منظم بعناوين ونقاط. رجّع JSON فقط بالشكل: {"title":"عنوان قصير","summary":"..."}';
const PQ=n=>'اعمل '+n+' سؤال اختيار من متعدد (4 اختيارات) من المحتوى التالي. رجّع JSON فقط: [{"q":"السؤال","o":["أ","ب","ج","د"],"a":0}] حيث a رقم الإجابة الصح.';
const P_C='اعمل 10 بطاقات مراجعة من المحتوى التالي. رجّع JSON فقط: [{"f":"السؤال أو المصطلح","b":"الإجابة"}]';
const BASE='https://generativelanguage.googleapis.com';
const getKey=()=>{const k=localStorage.k||'__GEMINI_KEY__';if(k.startsWith('__'))throw new Error('المفتاح مش متضاف، حطه من الإعدادات');return k};
/* ===== استدعاء Gemini: محاولة واحدة ===== */
async function gem1(parts,json){
 const key=getKey();let r,d;
 try{
  r=await fetch(BASE+'/v1beta/models/'+MODEL+':generateContent?key='+key,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts}],generationConfig:Object.assign({maxOutputTokens:32768},json?{responseMimeType:'application/json'}:{})})});
  d=await r.json();
 }catch(e){const er=new Error(e.message);er.retry=true;throw er}
 if(d.error){
  const er=new Error(d.error.message);er.status=r.status;
  er.retry=[429,500,502,503,504].includes(r.status)||/high demand|overloaded|try again|unavailable/i.test(d.error.message||'');
  throw er;
 }
 return d.candidates[0].content.parts.map(p=>p.text||'').join('');
}
/* ===== إعادة محاولة صامتة (من غير رسائل خطأ) ===== */
async function gemR(it,parts,json,label,max){
 max=max||80;
 for(let a=0;;a++){
  try{const t=await gem1(parts,json);if(it&&it.note){it.note='';refresh(it)}return t}
  catch(e){
   if(!e.retry||a>=max)throw e;
   if(it){it.note='⏳ '+label+': الخدمة مشغولة، بحاول تاني تلقائي...';refresh(it)}
   await sleep(Math.min(60000,5000*(a+1)));
  }
 }
}
async function upFile(blob,mime){
 const key=getKey();
 const s=await fetch(BASE+'/upload/v1beta/files?key='+key,{method:'POST',headers:{'X-Goog-Upload-Protocol':'resumable','X-Goog-Upload-Command':'start','X-Goog-Upload-Header-Content-Length':String(blob.size),'X-Goog-Upload-Header-Content-Type':mime,'Content-Type':'application/json'},body:JSON.stringify({file:{display_name:'lecture'}})});
 const url=s.headers.get('X-Goog-Upload-URL');if(!url){const er=new Error('فشل بدء رفع الملف');er.retry=true;throw er}
 const u=await fetch(url,{method:'POST',headers:{'X-Goog-Upload-Offset':'0','X-Goog-Upload-Command':'upload, finalize'},body:blob});
 let f=(await u.json()).file;if(!f){const er=new Error('فشل رفع الملف');er.retry=true;throw er}
 for(let i=0;i<80&&f.state==='PROCESSING';i++){await sleep(5000);f=await(await fetch(BASE+'/v1beta/'+f.name+'?key='+key)).json()}
 if(f.state!=='ACTIVE'){const er=new Error('الملف لسه بيتجهز');er.retry=true;throw er}
 return f;
}
async function audioPart(blob,mime){
 if(blob.size<14e6)return{inline_data:{mime_type:mime,data:await b64(blob)}};
 const f=await upFile(blob,mime);return{file_data:{mime_type:mime,file_uri:f.uri}};
}
/* ===== عمل PDF بالعربي ===== */
function mdBlocks(s){const out=[];String(s||'').split('\n').forEach(l=>{l=l.trim();if(!l){out.push({k:'g'});return}const m=l.match(/^#+\s*(.*)$/);if(m){out.push({k:'h',s:m[1].replace(/\*\*/g,'')});return}out.push({k:'p',s:l.replace(/^[\*\-]\s+/,'• ').replace(/\*\*/g,'')})});return out}
async function makePdf(blocks){
 try{await document.fonts.ready}catch(e){}
 const W=1240,H=1754,M=100;const jpgs=[];let y=0,started=false;
 const cv=document.createElement('canvas');cv.width=W;cv.height=H;const ctx=cv.getContext('2d');
 const fin=()=>{jpgs.push(Uint8Array.from(atob(cv.toDataURL('image/jpeg',0.8).split(',')[1]),ch=>ch.charCodeAt(0)))};
 const np=()=>{if(started)fin();started=true;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.direction='rtl';ctx.textAlign='right';ctx.textBaseline='top';y=M};
 np();
 const put=(text,size,bold,color)=>{
  const f=()=>{ctx.font=(bold?'bold ':'')+size+'px Amiri,Tajawal,sans-serif';ctx.fillStyle=color};
  f();let line='';
  const flush=l=>{if(y+size*1.9>H-M){np();f()}ctx.fillText(l,W-M,y);y+=size*1.9};
  text.split(/\s+/).filter(Boolean).forEach(w=>{const tst=line?line+' '+w:w;if(line&&ctx.measureText(tst).width>W-2*M){flush(line);line=w}else line=tst});
  if(line)flush(line);
 };
 for(const b of blocks){
  if(b.k=='g'){y+=22;continue}
  if(b.k=='t')put(b.s,56,true,'#4f46e5');
  else if(b.k=='h')put(b.s,40,true,'#4f46e5');
  else if(b.k=='b')put(b.s,32,true,'#1e1b4b');
  else if(b.k=='a')put(b.s,28,true,'#059669');
  else put(b.s,30,false,'#1e1b4b');
 }
 fin();
 const enc=new TextEncoder();const parts=[];let off=0;const offs=[];
 const add=x=>{const u=typeof x==='string'?enc.encode(x):x;parts.push(u);off+=u.length};
 const obj=(id,fn)=>{offs[id]=off;add(id+' 0 obj\n');fn();add('\nendobj\n')};
 const n=jpgs.length;
 add('%PDF-1.4\n');
 obj(1,()=>add('<< /Type /Catalog /Pages 2 0 R >>'));
 obj(2,()=>add('<< /Type /Pages /Kids ['+jpgs.map((_,i)=>(3+3*i)+' 0 R').join(' ')+'] /Count '+n+' >>'));
 jpgs.forEach((jpg,i)=>{
  const pid=3+3*i,cid=pid+1,iid=pid+2;
  obj(pid,()=>add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 '+iid+' 0 R >> >> /Contents '+cid+' 0 R >>'));
  const cs='q 595 0 0 842 0 0 cm /Im0 Do Q';
  obj(cid,()=>add('<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream'));
  obj(iid,()=>{add('<< /Type /XObject /Subtype /Image /Width '+W+' /Height '+H+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n');add(jpg);add('\nendstream')});
 });
 const xr=off,total=3+3*n;
 add('xref\n0 '+total+'\n0000000000 65535 f \n');
 for(let id=1;id<total;id++)add(String(offs[id]).padStart(10,'0')+' 00000 n \n');
 add('trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
 const out=new Uint8Array(off);let p=0;parts.forEach(u=>{out.set(u,p);p+=u.length});
 return out;
}
async function saveFile(bytes,name){
 const fs=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Filesystem;
 if(fs){
  try{try{await fs.requestPermissions()}catch(e){}
   await fs.writeFile({path:'Mulakhasati/'+name,data:u8b64(bytes),directory:'DOCUMENTS',recursive:true});return 'fs'}catch(e){}
 }
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
 return 'dl';
}
async function savePdfs(it){
 const nm=s=>String(s).replace(/[\\/:*?"<>|]/g,' ').trim().slice(0,60);
 const d=String(it.date||'').replace(/[\/\\]/g,'-');
 const L=['أ','ب','ج','د'];
 const b1=[{k:'t',s:it.title},{k:'p',s:it.date||''},{k:'g'},{k:'h',s:'الملخص'},...mdBlocks(it.summary)];
 if(it.quiz&&it.quiz.length){
  b1.push({k:'g'},{k:'h',s:'أسئلة وأجوبة على المحاضرة'});
  it.quiz.forEach((q,n)=>{b1.push({k:'g'},{k:'b',s:(n+1)+'. '+q.q});q.o.forEach((o,k)=>b1.push({k:'p',s:L[k]+') '+o}));b1.push({k:'a',s:'الإجابة الصحيحة: '+L[q.a]+') '+q.o[q.a]})});
 }
 let r=await saveFile(await makePdf(b1),'ملخص - '+nm(it.title)+' '+d+'.pdf');
 if(it.transcript){
  const b2=[{k:'t',s:it.title},{k:'p',s:it.date||''},{k:'g'},{k:'h',s:'نص المحاضرة كاملاً'},...mdBlocks(it.transcript)];
  r=await saveFile(await makePdf(b2),'المحاضرة كاملة - '+nm(it.title)+' '+d+'.pdf');
 }
 it.pdf=true;save();
 return r=='fs'?'✅ اتحفظ ملفات PDF على موبايلك في مجلد Documents/Mulakhasati':'ملفات PDF اتعملت وحاولت أنزلها. لو ماظهرتش في الموبايل لازم نضيف إضافة حفظ الملفات للتطبيق.';
}
/* ===== شاشات ===== */
let rt=0;
function refresh(it){if(rt)return;rt=setTimeout(()=>{rt=0;if((cur&&it&&cur.id==it.id)||(!cur&&tab=='lec'))render()},400)}
function go(t){tab=t;cur=null;render()}
function render(){
 const sc=[...document.querySelectorAll('.pb')].map(e=>e.scrollTop);
 $('#nav').style.display=cur?'none':'flex';
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
 $('#m').innerHTML=cur?detail():{lec:lecV,pdf:pdfV,sch:schV,set:setV}[tab]();
 document.querySelectorAll('.pb').forEach((e,i)=>{if(sc[i])e.scrollTop=sc[i]});
}
const stTxt=i=>i.err?'⚠️ حصلت مشكلة - اضغط':i.status=='rec'?'🔴 بيتسجل':i.status=='proc'?'⏳ بيجهز ('+(i.segs||[]).filter(s=>s.tx!=null).length+'/'+(i.segs||[]).length+')':'';
const itemCard=i=>`<div class="card ${i.err?'warn':''}" onclick="openI(${i.id})"><b>${i.type=='pdf'?'📄':'🎙️'} ${esc(i.title)}</b><small>${esc(i.date)}${i.dur?' • '+fmt(i.dur):''}${stTxt(i)?' • '+stTxt(i):''}</small></div>`;
const list=t=>db.items.filter(i=>i.type==t).map(itemCard).join('');
function openI(id){cur=db.items.find(i=>i.id==id);sub='a';zs={};op=null;render()}
async function del(id){
 if(!confirm('تحذف العنصر ده من التطبيق؟ (ملفات PDF اللي اتحفظت على الموبايل هتفضل زي ما هي)'))return;
 const it=db.items.find(i=>i.id==id);
 if(it&&it.segs)for(const s of it.segs)await adel(s.key||('sg'+id+'_'+s.n));
 db.items=db.items.filter(i=>i.id!=id);save();go(tab);
}
function lecV(){
 const rec=!!curSeg;
 const prog=curIt?`<small>أجزاء اتجهزت: ${curIt.segs.filter(s=>s.tx!=null).length}/${curIt.segs.length}</small>`:'';
 return `<h2>المحاضرات</h2><div class="card c">${rec?`<div class="tm">${fmt(secs)}</div><div class="row"><button class="btn" onclick="pauseRec()">${paused?'▶️ استكمال':'⏸️ إيقاف مؤقت'}</button><button class="btn red" onclick="stopRec()">⏹️ إنهاء</button></div><small>التسجيل بيتحفظ لحظة بلحظة وبيتحول لنص وإنت بتسجل. سيب الشاشة شغالة.</small>${prog}`:`<button class="big" onclick="startRec()">🎙️ ابدأ تسجيل محاضرة</button>`}</div>`+(list('lec')||'<p class="mt">مفيش محاضرات لسه</p>');
}
/* ===== التسجيل على أجزاء ===== */
function mkSeg(){
 const seg={id:Date.now(),chunks:[],start:secs,rec:new MediaRecorder(stream)};
 const mime=seg.rec.mimeType||'audio/webm';
 seg.rec.ondataavailable=async e=>{
  if(!e.data.size)return;
  seg.chunks.push(e.data);const n=seg.chunks.length;
  try{await aput('rc'+seg.id+'_'+n,e.data);if(curSeg===seg)localStorage.rcur=JSON.stringify({id:seg.id,n,mime,it:curIt&&curIt.id})}catch(_){}
 };
 seg.rec.start(5000);
 return seg;
}
async function closeSeg(seg,it){
 await new Promise(r=>{seg.rec.onstop=r;seg.rec.stop()});
 const blob=new Blob(seg.chunks,{type:seg.rec.mimeType||'audio/webm'});
 const dur=Math.max(0,secs-seg.start);
 if(blob.size>1000&&dur>=2){
  const n=it.segs.length+1;
  await aput('sg'+it.id+'_'+n,blob);
  it.segs.push({n,dur,tx:null});it.dur=secs;save();
 }
 await sleep(300);
 for(let i=1;i<=seg.chunks.length+1;i++)adel('rc'+seg.id+'_'+i);
}
async function startRec(){
 try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){alert('مش قادر أستخدم الميكروفون، اسمح بالإذن');return}
 const it={id:Date.now(),type:'lec',title:'محاضرة جديدة',date:new Date().toLocaleDateString('ar-EG'),dur:0,status:'rec',segs:[]};
 db.items.unshift(it);save();curIt=it;
 secs=0;paused=false;rotating=false;
 curSeg=mkSeg();
 try{if(navigator.wakeLock)wl=await navigator.wakeLock.request('screen')}catch(e){}
 ti=setInterval(()=>{
  if(paused||!curSeg)return;
  secs++;const t=$('.tm');if(t)t.textContent=fmt(secs);
  if(secs-curSeg.start>=SEG)rotate();
 },1000);
 render();
}
function pauseRec(){if(!curSeg)return;if(paused)curSeg.rec.resume();else curSeg.rec.pause();paused=!paused;render()}
async function rotate(){
 if(rotating||paused||!curSeg)return;rotating=true;
 try{const old=curSeg;curSeg=mkSeg();await closeSeg(old,curIt);pump(curIt)}catch(e){}
 rotating=false;
}
async function stopRec(){
 clearInterval(ti);
 while(rotating)await sleep(100);
 const seg=curSeg,it=curIt;curSeg=null;
 try{await closeSeg(seg,it)}catch(e){}
 try{stream.getTracks().forEach(t=>t.stop())}catch(e){}
 try{if(wl)wl.release()}catch(e){};wl=null;
 localStorage.removeItem('rcur');
 curIt=null;
 if(!it.segs.length){db.items=db.items.filter(x=>x.id!=it.id);save();alert('التسجيل كان قصير جداً');render();return}
 it.status='proc';it.dur=secs;save();
 pump(it);cur=it;sub='a';zs={};op=null;render();
}
async function recoverItem(it){
 it.segs=it.segs||[];
 let rc=null;try{rc=JSON.parse(localStorage.rcur||'null')}catch(e){}
 if(rc&&rc.it==it.id){
  const parts=[];for(let i=1;i<=rc.n;i++){const c=await aget('rc'+rc.id+'_'+i);if(c)parts.push(c)}
  if(parts.length){const n=it.segs.length+1;await aput('sg'+it.id+'_'+n,new Blob(parts,{type:rc.mime||'audio/webm'}));it.segs.push({n,dur:parts.length*5,tx:null});for(let i=1;i<=rc.n;i++)adel('rc'+rc.id+'_'+i)}
  localStorage.removeItem('rcur');
 }
 if(!it.segs.length)db.items=db.items.filter(x=>x.id!=it.id);else it.status='proc';
 save();
}
/* ===== المعالجة في الخلفية (نص ← ملخص + أسئلة ← PDF) ===== */
async function doSeg(it,s){
 const lbl='النص ('+s.n+'/'+it.segs.length+')';
 const blob=await aget(s.key||('sg'+it.id+'_'+s.n));
 if(!blob){s.tx='[الصوت مش موجود]';save();return}
 const ap=await audioPart(blob,(blob.type||'audio/webm').split(';')[0]);
 if((s.dur||0)>1800){
  const mins=Math.ceil(s.dur/60),out=[];
  for(let a=0;a<mins;a+=25)out.push(await gemR(it,[ap,{text:P_T+' اكتب بس الجزء من الدقيقة '+a+' لحد الدقيقة '+Math.min(a+25,mins)+' من التسجيل.'}],false,lbl));
  s.tx=out.join('\n\n');
 }else s.tx=await gemR(it,[ap,{text:P_T}],false,lbl);
 save();refresh(it);
}
async function finish(it){
 if(!it.transcript){it.transcript=it.segs.map(s=>s.tx).join('\n\n');save();refresh(it)}
 const mins=Math.max(1,Math.round((it.dur||0)/60));
 const jobs=[];
 if(!it.summary)jobs.push((async()=>{
  const j=safeJ(await gemR(it,[{text:P_S2+'\n\n'+it.transcript}],true,'الملخص'));
  it.title=j.title||'محاضرة';it.summary=j.summary||'';save();refresh(it);
 })());
 if(!it.quiz)jobs.push((async()=>{
  let q=null;
  for(let k=0;k<3&&!q;k++){
   try{const x=JSON.parse(await gemR(it,[{text:PQ(Math.min(20,Math.max(8,Math.round(mins/10))))+'\n\n'+it.transcript}],true,'الأسئلة'));if(Array.isArray(x)&&x.length)q=x}catch(e){if(e.status)throw e}
  }
  it.quiz=q||[];save();refresh(it);
 })());
 await Promise.all(jobs);
 delete it.status;it.note='';save();refresh(it);
 try{it.info=await savePdfs(it);save()}catch(e){}
 refresh(it);
}
async function pump(it){
 if(pumping[it.id]){again[it.id]=1;return}
 pumping[it.id]=1;
 try{
  for(;;){
   const s=(it.segs||[]).find(x=>x.tx==null);
   if(s){await doSeg(it,s);continue}
   if(it.status=='rec'){if(again[it.id]){again[it.id]=0;continue}break}
   if(it.status!='proc')break;
   await finish(it);break;
  }
  it.err='';
 }catch(e){it.err=e.message||'حصلت مشكلة';it.note='';save()}
 pumping[it.id]=0;refresh(it);
}
function retryErr(id){const it=db.items.find(i=>i.id==id);if(it){it.err='';pump(it);render()}}
async function boot(){
 for(const it of db.items.slice()){
  if(it.type!='lec')continue;
  try{
   if(it.status=='pending'){if(await aget('au'+it.id)){it.segs=[{n:1,dur:it.dur||0,tx:null,key:'au'+it.id}];it.status='proc'}else continue}
   if(it.status=='rec')await recoverItem(it);
   if(it.status=='proc')pump(it);
  }catch(e){}
 }
 save();render();
}
function dlBlob(b,name){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name+'.webm';document.body.appendChild(a);a.click();a.remove()}
async function dlAudio(id){
 const it=db.items.find(i=>i.id==id);if(!it||!it.segs||!it.segs.length)return alert('مفيش ملف صوتي');
 for(const s of it.segs){const b=await aget(s.key||('sg'+id+'_'+s.n));if(b)dlBlob(b,'lecture-'+id+'-part'+s.n)}
}
async function pdfsBtn(id){const it=db.items.find(i=>i.id==id);if(!it)return;busy('⏳ بحفظ ملفات PDF...');try{const m=await savePdfs(it);busy();alert(m)}catch(e){busy();alert('حصل خطأ: '+e.message)}}
/* ===== PDF بيتلخص ===== */
function pdfV(){return `<h2>ملفات PDF</h2><div class="card c"><input type="file" accept="application/pdf" onchange="addPdf(this.files[0])"><small>اختار ملف PDF عشان يتلخص</small></div>`+(list('pdf')||'<p class="mt">مفيش ملفات لسه</p>')}
async function addPdf(f){
 if(!f)return;busy('⏳ بقرا الملف وبلخصه...');
 try{
  const j=safeJ(await gemR(null,[{inline_data:{mime_type:'application/pdf',data:await b64(f)}},{text:P_PDF}],true,'',15));
  const it={id:Date.now(),type:'pdf',title:j.title||f.name,date:new Date().toLocaleDateString('ar-EG'),summary:j.summary};
  db.items.unshift(it);save();cur=it;sub='a';zs={};
 }catch(e){alert('حصل خطأ: '+e.message)}
 busy();render();
}
/* ===== شاشة المحاضرة: 3 أقسام ===== */
function pane(id,title,body){
 const o=op==id,c=op&&!o;
 return `<div class="pane" ${c?'style="flex:0 0 auto"':''}><div class="ph" onclick="op=(op=='${id}'?null:'${id}');render()"><span>${title}</span><span>${o?'🔽':'🔼'}</span></div><div class="pb" ${c?'style="display:none"':''}>${body}</div></div>`;
}
function lecDetail(i){
 const tx=i.transcript||(i.segs||[]).map(s=>s.tx).filter(Boolean).join('\n\n');
 const wait=t=>`<p class="mt">⏳ ${t}</p>`;
 const tb=tx?md(tx):wait('النص بيتكتب...');
 const qb=i.quiz&&i.quiz.length?i.quiz.map((q,n)=>`<div style="margin-bottom:16px"><b>${n+1}. ${esc(q.q)}</b>${q.o.map((o,k)=>`<button class="opt ${zs[n]==null?'':k==q.a?'ok':zs[n]==k?'no':''}" onclick="ans(${n},${k})">${esc(o)}</button>`).join('')}</div>`).join(''):wait(i.status?'الأسئلة بتتجهز بعد ما المحاضرة تخلص':'مفيش أسئلة');
 const sb=i.summary?md(i.summary):wait(i.status?'الملخص بيتجهز بعد ما المحاضرة تخلص':'مفيش ملخص');
 const banner=(i.err?`<div class="card warn c"><b>⚠️ ${esc(i.err)}</b><button class="btn" onclick="retryErr(${i.id})">🔁 حاول تاني</button></div>`:'')+(i.status=='rec'?'<div class="note">🔴 التسجيل شغال</div>':'')+(i.note?`<div class="note">${esc(i.note)}</div>`:'')+(!i.status&&i.info?`<div class="note">${esc(i.info)}</div>`:'');
 return `<div class="top"><button class="ic" onclick="go(tab)">➡️</button><b class="tt">${esc(i.title)}</b><div><button class="ic" onclick="pdfsBtn(${i.id})">📄</button><button class="ic" onclick="dlAudio(${i.id})">💾</button><button class="ic" onclick="del(${i.id})">🗑️</button></div></div>${banner}<div id="panes">${pane('t','📃 الكلام كله اللي اتقال',tb)}${pane('q','❓ أسئلة وأجوبة',qb)}${pane('s','📝 الملخص',sb)}</div>`;
}
function detail(){
 const i=cur;
 if(i.type=='lec')return lecDetail(i);
 const tabs=[['a','📝 الملخص'],['q','❓ اختبار'],['c','🃏 بطاقات']];
 let b;
 if(sub=='a')b=`<div class="read">${md(i.summary)}</div>`;
 else if(sub=='q')b=i.quiz?i.quiz.map((q,n)=>`<div class="card"><b>${n+1}. ${esc(q.q)}</b>${q.o.map((o,k)=>`<button class="opt ${zs[n]==null?'':k==q.a?'ok':zs[n]==k?'no':''}" onclick="ans(${n},${k})">${esc(o)}</button>`).join('')}</div>`).join(''):`<button class="big" onclick="gen('quiz')">إنشاء اختبار</button>`;
 else b=i.cards?i.cards.map(c=>`<div class="card"><details><summary>${esc(c.f)}</summary><p>${esc(c.b)}</p></details></div>`).join(''):`<button class="big" onclick="gen('cards')">إنشاء بطاقات</button>`;
 return `<div class="top"><button class="ic" onclick="go(tab)">➡️</button><b class="tt">${esc(i.title)}</b><button class="ic" onclick="del(${i.id})">🗑️</button></div><div class="seg">${tabs.map(t=>`<button class="${sub==t[0]?'on':''}" onclick="sub='${t[0]}';render()">${t[1]}</button>`).join('')}</div>${b}`;
}
function ans(n,k){if(zs[n]==null){zs[n]=k;render()}}
async function gen(k){
 busy('⏳ لحظة...');
 try{cur[k]=JSON.parse(await gemR(null,[{text:(k=='quiz'?PQ(8):P_C)+'\n\n'+(cur.transcript||cur.summary)}],true,'',15));save()}catch(e){alert('حصل خطأ: '+e.message)}
 busy();render();
}
/* ===== الجدول ===== */
function schV(){
 const l=[...db.sched].sort((a,b)=>a.day-b.day||String(a.time).localeCompare(b.time));
 return `<h2>الجدول</h2><div class="card"><input id="st" placeholder="اسم المادة"><select id="sd">${D.map((d,i)=>`<option value="${i}">${d}</option>`).join('')}</select><input id="sm" type="time" value="09:00"><button class="big up" onclick="addS()">➕ إضافة</button></div>`+(l.map(s=>`<div class="card top"><div><b>${esc(s.t)}</b><small>${D[s.day]} • ${esc(s.time)}${s.nid?' 🔔':''}</small></div><button class="ic" onclick="delS(${s.id})">🗑️</button></div>`).join('')||'<p class="mt">الجدول فاضي</p>');
}
const LN=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;
async function notifOn(x){
 const n=LN();if(!n)return false;
 try{
  const p=await n.requestPermissions();if(p.display!=='granted')return false;
  try{await n.createChannel({id:'study',name:'تذكير المذاكرة',importance:5,vibration:true})}catch(e){}
  await n.schedule({notifications:[{id:x.nid,channelId:'study',title:'📚 وقت المذاكرة',body:x.t,schedule:{on:{weekday:x.day+1,hour:+x.time.slice(0,2),minute:+x.time.slice(3,5)},allowWhileIdle:true}}]});
  return true;
 }catch(e){return false}
}
async function notifOff(x){const n=LN();if(n&&x.nid)try{await n.cancel({notifications:[{id:x.nid}]})}catch(e){}}
async function addS(){
 const t=$('#st').value.trim();if(!t)return;
 const x={id:Date.now(),nid:Math.floor(Math.random()*2e9)+1,t,day:+$('#sd').value,time:$('#sm').value||'09:00'};
 db.sched.push(x);save();render();
 if(!await notifOn(x))alert('اتضافت في الجدول، بس التنبيه مش شغال: اسمح بالإشعارات للتطبيق أو نزّل أحدث نسخة');
}
async function delS(id){const x=db.sched.find(s=>s.id==id);if(x)await notifOff(x);db.sched=db.sched.filter(s=>s.id!=id);save();render()}
async function clearAll(){
 if(!confirm('تمسح كل البيانات؟ (المحاضرات والصوت)'))return;
 for(const x of db.sched)await notifOff(x);
 for(const i of db.items)if(i.segs)for(const s of i.segs)await adel(s.key||('sg'+i.id+'_'+s.n));
 db={items:[],sched:[]};save();render();
}
function setV(){return `<h2>الإعدادات</h2><div class="card"><b>مفتاح Gemini</b><input id="gk" type="password" placeholder="الصق المفتاح هنا" value="${esc(localStorage.k||'')}"><button class="big up" onclick="localStorage.k=$('#gk').value.trim();alert('اتحفظ')">حفظ</button></div><div class="card"><button class="btn red" onclick="clearAll()">🗑️ مسح كل البيانات</button></div>`}
render();boot();
</script></body></html>
