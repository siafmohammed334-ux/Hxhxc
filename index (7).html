<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--p:#4f46e5;--t:#14b8a6;--bg:#f5f6fb;--c:#fff;--tx:#1e1b4b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:80px}
header{background:linear-gradient(135deg,var(--p),var(--t));color:#fff;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 16px;font-weight:800;font-size:20px}
main{padding:14px;max-width:700px;margin:auto}
h2{margin:6px 0 12px}
.card{background:var(--c);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #4f46e514}
.card small{display:block;color:#6b7280;margin-top:4px}
.c{text-align:center}.mt{color:#6b7280;text-align:center}
button{font-family:inherit;cursor:pointer}
.big{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--p),var(--t));text-align:center}
.up{margin:8px 0}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--p);color:#fff;font-weight:700;margin:8px 4px;font-size:15px}
.red{background:#e11d48}
.row{display:flex;justify-content:center;flex-wrap:wrap}
.tm{font-size:40px;font-weight:800;margin:6px 0;color:var(--p)}
.read{background:#fff;border-radius:16px;padding:18px;margin:10px 0;font-family:Amiri,Tajawal,serif;font-size:20px;line-height:2.1}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ic{border:0;background:#fff;border-radius:10px;width:40px;height:40px;font-size:18px}
.seg{display:flex;gap:6px;overflow-x:auto;margin:10px 0}
.seg button{flex:1;white-space:nowrap;border:0;padding:10px 12px;border-radius:12px;background:#e0e7ff;color:var(--p);font-weight:700}
.seg .on{background:var(--p);color:#fff}
input,select{width:100%;padding:12px;margin:5px 0;border:1px solid #d1d5db;border-radius:10px;font-family:inherit;font-size:15px}
table{width:100%;margin-top:6px}td{padding:6px 4px;border-top:1px solid #eee}
details summary{font-weight:700;cursor:pointer}details p{color:#374151;line-height:1.8}
.opt{display:block;width:100%;text-align:right;margin:6px 0;padding:11px;border-radius:10px;border:1px solid #d1d5db;background:#fff;font-size:15px}
.opt.ok{background:#d1fae5;border-color:#10b981}.opt.no{background:#ffe4e6;border-color:#e11d48}
#pv canvas{width:100%;margin:6px 0;border-radius:8px;background:#fff}
#nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #e5e7eb;padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1;border:0;background:none;padding:10px 4px;font-size:12px;color:#6b7280;font-weight:700}
#nav button span{display:block;font-size:22px}#nav .on{color:var(--p)}
#ld{display:none;position:fixed;inset:0;background:#000a;color:#fff;align-items:center;justify-content:center;font-size:18px;font-weight:700;z-index:9;text-align:center;padding:20px}
</style></head><body>
<header>📚 ملخصاتي</header><main id="m"></main>
<nav id="nav">
<button data-t="lec" onclick="go('lec')"><span>🎙️</span>محاضرات</button>
<button data-t="pdf" onclick="go('pdf')"><span>📄</span>PDF</button>
<button data-t="sch" onclick="go('sch')"><span>🗓️</span>الجدول</button>
<button data-t="set" onclick="go('set')"><span>⚙️</span>إعدادات</button></nav>
<div id="ld"></div>
<script>
window.onerror=(m)=>{const x=document.querySelector('#m');if(x)x.innerHTML='<div class="card">حصل خطأ: '+m+'</div>'};
const $=s=>document.querySelector(s);
const MODEL='gemini-2.5-flash';
let db;try{db=JSON.parse(localStorage.ms||'null')}catch(e){}
db=db||{items:[],sched:[]};db.items=db.items||[];db.sched=db.sched||[];
const save=()=>{try{localStorage.ms=JSON.stringify(db)}catch(e){alert('المساحة مليانة')}};
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const md=s=>esc(s).replace(/^#+\s*(.*)$/gm,'<h4>$1</h4>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^[\*\-]\s+(.*)$/gm,'• $1').replace(/\n/g,'<br>');
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(b)});
const busy=m=>{const l=$('#ld');l.style.display=m?'flex':'none';l.textContent=m||''};
const D=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
let tab='lec',cur=null,sub='a',zs={},mr,stream,chunks=[],secs=0,ti,paused=false;
const P_LEC='ده تسجيل محاضرة. اكتب النص الكامل للكلام (transcript) ثم لخصه تلخيص منظم بعناوين ونقاط. رجّع JSON فقط بالشكل: {"title":"عنوان قصير","transcript":"...","summary":"..."}';
const P_PDF='لخّص ملف الـ PDF ده تلخيص منظم بعناوين ونقاط. رجّع JSON فقط بالشكل: {"title":"عنوان قصير","summary":"..."}';
const P_Q='اعمل 8 أسئلة اختيار من متعدد (4 اختيارات) من المحتوى التالي. رجّع JSON فقط: [{"q":"السؤال","o":["أ","ب","ج","د"],"a":0}] حيث a رقم الإجابة الصح.';
const P_C='اعمل 10 بطاقات مراجعة من المحتوى التالي. رجّع JSON فقط: [{"f":"السؤال أو المصطلح","b":"الإجابة"}]';
async function gem(parts,json){
 const key=localStorage.k||'__GEMINI_KEY__';if(key.startsWith('__'))throw new Error('المفتاح مش متضاف');
 const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+MODEL+':generateContent?key='+key,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts}],generationConfig:json?{responseMimeType:'application/json'}:{}})});
 const d=await r.json();if(d.error)throw new Error(d.error.message);
 return d.candidates[0].content.parts.map(p=>p.text||'').join('');
}
function go(t){tab=t;cur=null;render()}
function render(){
 $('#nav').style.display=cur?'none':'flex';
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
 $('#m').innerHTML=cur?detail():{lec:lecV,pdf:pdfV,sch:schV,set:setV}[tab]();
}
const itemCard=i=>`<div class="card" onclick="openI(${i.id})"><b>${i.type=='pdf'?'📄':'🎙️'} ${esc(i.title)}</b><small>${esc(i.date)}${i.dur?' • '+fmt(i.dur):''}</small></div>`;
const list=t=>db.items.filter(i=>i.type==t).map(itemCard).join('');
function openI(id){cur=db.items.find(i=>i.id==id);sub='a';zs={};render()}
function del(id){if(!confirm('تحذف العنصر ده؟'))return;db.items=db.items.filter(i=>i.id!=id);save();go(tab)}
function lecV(){
 const rec=mr&&mr.state!='inactive';
 return `<h2>المحاضرات</h2><div class="card c">${rec?`<div class="tm">${fmt(secs)}</div><div class="row"><button class="btn" onclick="pauseRec()">${paused?'▶️ استكمال':'⏸️ إيقاف مؤقت'}</button><button class="btn red" onclick="stopRec()">⏹️ إنهاء وتلخيص</button></div>`:`<button class="big" onclick="startRec()">🎙️ ابدأ تسجيل محاضرة</button>`}</div>`+(list('lec')||'<p class="mt">مفيش محاضرات لسه</p>');
}
async function startRec(){
 try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){alert('مش قادر أستخدم الميكروفون، اسمح بالإذن');return}
 chunks=[];secs=0;paused=false;
 mr=new MediaRecorder(stream);mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
 mr.start(1000);
 ti=setInterval(()=>{if(!paused){secs++;const t=$('.tm');if(t)t.textContent=fmt(secs)}},1000);
 render();
}
function pauseRec(){if(paused)mr.resume();else mr.pause();paused=!paused;render()}
async function stopRec(){
 clearInterval(ti);const d=secs;
 await new Promise(r=>{mr.onstop=r;mr.stop()});
 stream.getTracks().forEach(t=>t.stop());
 const blob=new Blob(chunks,{type:mr.mimeType||'audio/webm'});
 busy('⏳ بلخّص المحاضرة...');
 try{
  const a=await b64(blob);
  const j=JSON.parse(await gem([{inline_data:{mime_type:(blob.type||'audio/webm').split(';')[0],data:a}},{text:P_LEC}],true));
  const it={id:Date.now(),type:'lec',title:j.title||'محاضرة',date:new Date().toLocaleDateString('ar-EG'),dur:d,transcript:j.transcript,summary:j.summary};
  db.items.unshift(it);save();cur=it;sub='a';zs={};
 }catch(e){alert('حصل خطأ: '+e.message)}
 busy();mr=null;render();
}
function pdfV(){return `<h2>ملفات PDF</h2><div class="card c"><input type="file" accept="application/pdf" onchange="addPdf(this.files[0])"><small>اختار ملف PDF عشان يتلخص</small></div>`+(list('pdf')||'<p class="mt">مفيش ملفات لسه</p>')}
async function addPdf(f){
 if(!f)return;busy('⏳ بقرا الملف وبلخصه...');
 try{
  const j=JSON.parse(await gem([{inline_data:{mime_type:'application/pdf',data:await b64(f)}},{text:P_PDF}],true));
  const it={id:Date.now(),type:'pdf',title:j.title||f.name,date:new Date().toLocaleDateString('ar-EG'),summary:j.summary};
  db.items.unshift(it);save();cur=it;sub='a';zs={};
 }catch(e){alert('حصل خطأ: '+e.message)}
 busy();render();
}
function detail(){
 const i=cur,tabs=[['a','📝 الملخص'],['q','❓ اختبار'],['c','🃏 بطاقات']];if(i.transcript)tabs.push(['t','📃 النص']);
 let b;
 if(sub=='a')b=`<div class="read">${md(i.summary)}</div>`;
 else if(sub=='t')b=`<div class="read">${md(i.transcript)}</div>`;
 else if(sub=='q')b=i.quiz?i.quiz.map((q,n)=>`<div class="card"><b>${n+1}. ${esc(q.q)}</b>${q.o.map((o,k)=>`<button class="opt ${zs[n]==null?'':k==q.a?'ok':zs[n]==k?'no':''}" onclick="ans(${n},${k})">${esc(o)}</button>`).join('')}</div>`).join(''):`<button class="big" onclick="gen('quiz')">إنشاء اختبار</button>`;
 else b=i.cards?i.cards.map(c=>`<div class="card"><details><summary>${esc(c.f)}</summary><p>${esc(c.b)}</p></details></div>`).join(''):`<button class="big" onclick="gen('cards')">إنشاء بطاقات</button>`;
 return `<div class="top"><button class="ic" onclick="go(tab)">➡️</button><b>${esc(i.title)}</b><button class="ic" onclick="del(${i.id})">🗑️</button></div><div class="seg">${tabs.map(t=>`<button class="${sub==t[0]?'on':''}" onclick="sub='${t[0]}';render()">${t[1]}</button>`).join('')}</div>${b}`;
}
function ans(n,k){if(zs[n]==null){zs[n]=k;render()}}
async function gen(k){
 busy('⏳ لحظة...');
 try{cur[k]=JSON.parse(await gem([{text:(k=='quiz'?P_Q:P_C)+'\n\n'+(cur.transcript||cur.summary)}],true));save()}catch(e){alert('حصل خطأ: '+e.message)}
 busy();render();
}
function schV(){
 const l=[...db.sched].sort((a,b)=>a.day-b.day||String(a.time).localeCompare(b.time));
 return `<h2>الجدول</h2><div class="card"><input id="st" placeholder="اسم المادة"><select id="sd">${D.map((d,i)=>`<option value="${i}">${d}</option>`).join('')}</select><input id="sm" type="time" value="09:00"><button class="big up" onclick="addS()">➕ إضافة</button></div>`+(l.map(s=>`<div class="card top"><div><b>${esc(s.t)}</b><small>${D[s.day]} • ${esc(s.time)}</small></div><button class="ic" onclick="delS(${s.id})">🗑️</button></div>`).join('')||'<p class="mt">الجدول فاضي</p>');
}
function addS(){const t=$('#st').value.trim();if(!t)return;db.sched.push({id:Date.now(),t,day:+$('#sd').value,time:$('#sm').value||'09:00'});save();render()}
function delS(id){db.sched=db.sched.filter(s=>s.id!=id);save();render()}
function setV(){return `<h2>الإعدادات</h2><div class="card"><b>مفتاح Gemini</b><input id="gk" type="password" placeholder="الصق المفتاح هنا" value="${esc(localStorage.k||'')}"><button class="big up" onclick="localStorage.k=$('#gk').value.trim();alert('اتحفظ')">حفظ</button></div><div class="card"><button class="btn red" onclick="if(confirm('تمسح كل البيانات؟')){db={items:[],sched:[]};save();render()}">🗑️ مسح كل البيانات</button></div>`}
render();
</script></body></html>
